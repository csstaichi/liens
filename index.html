<!DOCTYPE html>
<!-- index.html — portail CSS Moorea Tahiti — version 00.36.00 — 17 août 2026 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Titre et description : c'est ce qui s'affiche quand quelqu'un colle
     l'adresse dans un message. Le nom du site internet n'y figure pas,
     conformément à la règle de cette page publique. -->
<title>CSS Moorea Tahiti — nos liens</title>
<meta name="description" content="Tai chi à Moorea et Tahiti : actualités, adhésion, événements et conversations de l'association.">

<!-- Polices auto-hébergées, aucun appel à un domaine tiers.
     Fraunces pour le titre : sérif contemporain à contraste doux, lu
     lentement, en accord avec la discipline. Karla pour le texte :
     grotesque à hauteur d'x généreuse, lisible en petit corps. -->
<!-- Aperçu affiché par Facebook, Messenger et WhatsApp quand l'adresse est
     collée dans un message. Ces valeurs sont écrites en dur, contrairement
     au reste des textes : les robots de ces plateformes lisent le HTML sans
     exécuter le JavaScript, un texte posé par liens.js ne serait jamais vu.
     L'adresse de l'image DOIT être absolue, une adresse relative n'est pas
     résolue par ces robots.
     L'image partage.jpg est neutre et publique : elle ne cite ni l'espace
     réservé ni le site de l'association, puisqu'un aperçu circule partout,
     y compris hors des adhérents. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="CSS Moorea Tahiti">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://csstaichi.github.io/liens/">
<meta property="og:title" content="CSS Moorea Tahiti — nos liens">
<meta property="og:description" content="Tai chi, cours gratuits à Moorea et Tahiti. Actualités, adhésion, événements et conversations de l'association.">
<meta property="og:image" content="https://csstaichi.github.io/liens/assets/partage.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo et nom de l'association CSS Moorea Tahiti">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CSS Moorea Tahiti — nos liens">
<meta name="twitter:description" content="Tai chi, cours gratuits à Moorea et Tahiti. Actualités, adhésion, événements et conversations de l'association.">
<meta name="twitter:image" content="https://csstaichi.github.io/liens/assets/partage.jpg">

<!-- Icône d'onglet et de raccourci sur l'écran d'accueil. -->
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">

<link rel="stylesheet" href="assets/polices.css">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Pavé 1 : l'image de fond, en position fixe derrière tout le reste. -->
<div class="fond"></div>

<!-- Pavé 2 : l'en-tête. Le logo de l'association est l'élément signature.
     Les attributs width et height sont posés pour que le navigateur
     réserve la place avant le chargement de l'image : sans eux, le titre
     saute vers le bas quand le logo arrive. -->
<header class="entete">

  <img class="logo" src="assets/logo.png" width="108" height="108"
       alt="Logo de l'association CSS Moorea Tahiti">

  <p class="sur-titre" data-dico="entete_sur_titre_public"></p>
  <h1 class="titre" data-dico="entete_titre"></h1>
  <p class="sous-titre" data-dico="entete_sous_titre_public"></p>
</header>

<!-- Pavé 3 : la pile de boutons. Vide dans le fichier : elle est remplie
     par liens.js à partir du jeu « publique ». -->
<main class="liens" id="liens"></main>

<!-- Pavé 4 : secours si JavaScript est désactivé. Un seul lien y est écrit
     en dur, celui de la page Facebook : c'est le point de contact de
     l'association et il ne révèle rien de réservé. -->
<noscript>
  <div class="secours">
    <span data-dico="alerte_sans_js">Cette page a besoin de JavaScript pour afficher les liens.</span><br>
    <span data-dico="alerte_sans_js_secours">Écrivez-nous sur notre page Facebook :</span><br>
    <a href="https://www.facebook.com/TaiChi.CSSMooreaTahiti">facebook.com/TaiChi.CSSMooreaTahiti</a>
  </div>
</noscript>

<!-- Pavé 5 : mention de pied de page. -->
<footer class="pied" data-dico="pied_mention"></footer>

<!-- Numéro de version, posé par liens.js depuis une valeur unique. -->
<p class="version" id="version"></p>

<!-- Pavé 6 : chargement du dictionnaire puis appel du jeu de cette page.
     Le nom du jeu est le seul réglage propre à ce fichier. -->
<script src="liens.js"></script>
<script>demarrer("publique");</script>

</body>
</html>
