<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CSS Moorea Tahiti — espace adhérents</title>
<meta name="description" content="Tous les accès de l'association réunis : site, vidéos, musiques, adhésion et conversations.">

<!-- PAS de balise robots noindex sur cette page, et c'est délibéré.
     Elle en portait une jusqu'à la version 00.07.00. Constat fait à
     l'usage : le compositeur de publication Facebook affichait bien
     l'aperçu, mais Messenger et WhatsApp ne montraient aucune image. Ces
     deux applications utilisent un robot d'aperçu distinct, qui respecte
     le noindex et supprime le cartouche.
     Or cette page est diffusée exclusivement dans ces deux conversations :
     y perdre l'aperçu revenait à le perdre partout où il sert.
     Le risque d'indexation reste faible : aucun site ne pointe vers cette
     adresse, et Google découvre surtout par les liens entrants.
     POUR REVENIR EN ARRIÈRE, si l'indexation devient gênante : remettre
     la ligne ci-dessous, en sachant que l'aperçu disparaîtra à nouveau.
     <meta name="robots" content="noindex, nofollow">
-->

<!-- Mêmes polices auto-hébergées que la page publique. -->
<!-- Aperçu affiché par Facebook, Messenger et WhatsApp quand l'adresse est
     collée dans un message. Ces valeurs sont écrites en dur, contrairement
     au reste des textes : les robots de ces plateformes lisent le HTML sans
     exécuter le JavaScript, un texte posé par liens.js ne serait jamais vu.
     L'adresse de l'image DOIT être absolue, une adresse relative n'est pas
     résolue par ces robots.
     L'image partage.jpg est neutre et publique : elle ne cite ni l'espace
     réservé ni le site de l'association, puisqu'un aperçu circule partout,
     y compris hors des adhérents. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="CSS Moorea Tahiti">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://csstaichi.github.io/liens/adherents.html">
<meta property="og:title" content="CSS Moorea Tahiti — espace adhérents">
<meta property="og:description" content="Tous les accès de l'association réunis au même endroit.">
<meta property="og:image" content="https://csstaichi.github.io/liens/assets/partage.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Logo et nom de l'association CSS Moorea Tahiti">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CSS Moorea Tahiti — espace adhérents">
<meta name="twitter:description" content="Tous les accès de l'association réunis au même endroit.">
<meta name="twitter:image" content="https://csstaichi.github.io/liens/assets/partage.jpg">

<!-- Icône d'onglet et de raccourci sur l'écran d'accueil. -->
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">

<link rel="stylesheet" href="assets/polices.css">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Pavé 1 : image de fond, identique à la page publique. -->
<div class="fond"></div>

<!-- Pavé 2 : en-tête. Même logo signature ; sur-titre et sous-titre
     différents, ils disent à l'adhérent qu'il est au bon endroit. -->
<header class="entete">

  <img class="logo" src="assets/logo.png" width="108" height="108"
       alt="Logo de l'association CSS Moorea Tahiti">

  <p class="sur-titre" data-dico="entete_sur_titre_adherents"></p>
  <h1 class="titre" data-dico="entete_titre"></h1>
  <p class="sous-titre" data-dico="entete_sous_titre_adherents"></p>
</header>

<!-- Pavé 3 : la pile de boutons, remplie par liens.js avec le jeu complet. -->
<main class="liens" id="liens"></main>

<!-- Pavé 3 bis : comment obtenir l'accès aux deux conversations.
     Les deux groupes sont en approbation par un administrateur : aucun
     lien ne permet de demander à entrer, la démarche passe par un
     message. Tous les textes viennent du dictionnaire. -->
<section class="demande">
  <h2 class="demande-titre" data-dico="demande_titre"></h2>
  <p data-dico="demande_texte"></p>
  <p class="demande-ligne" data-dico="demande_messenger"></p>
  <p class="demande-ligne" data-dico="demande_whatsapp"></p>
</section>


<!-- Pavé 4 : secours sans JavaScript. Ici le lien écrit en dur est celui du
     site de l'association, puisque cette page lui est déjà consacrée. -->
<noscript>
  <div class="secours">
    <span data-dico="alerte_sans_js">Cette page a besoin de JavaScript pour afficher les liens.</span><br>
    <a href="https://www.csstahitimoorea.org/accueil">csstahitimoorea.org</a>
  </div>
</noscript>

<!-- Pavé 6 : mention de pied de page. -->
<footer class="pied" data-dico="pied_mention"></footer>

<!-- Numéro de version, posé par liens.js depuis une valeur unique. -->
<p class="version" id="version"></p>

<!-- Pavé 7 : dictionnaire puis jeu de cette page. -->
<script src="liens.js"></script>
<script>demarrer("adherents");</script>

</body>
</html>
